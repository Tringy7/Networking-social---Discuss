<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Choosing where React state belongs</title>
  <desc id="desc">Local state for one component, shared state across screens, and server state for remote data.</desc>
  <rect width="1200" height="600" fill="#edf0f2"/>
  <g font-family="Arial, sans-serif" fill="#26343c">
    <text x="64" y="72" font-size="16" letter-spacing="2">DISCUSS / FRONTEND NOTES</text>
    <text x="64" y="144" font-size="46" font-weight="700">Where does your state belong?</text>
    <text x="64" y="186" font-size="22" fill="#53636c">Start close to the component. Share only what needs to travel.</text>
    <path d="M224 282H976" stroke="#a9b4ba" stroke-width="3"/>
    <g fill="#fff" stroke="#c7cfd4"><rect x="64" y="248" width="328" height="230" rx="14"/><rect x="436" y="248" width="328" height="230" rx="14"/><rect x="808" y="248" width="328" height="230" rx="14"/></g>
    <g fill="#c7512c" font-size="18" font-weight="700"><text x="92" y="290">01 / LOCAL</text><text x="464" y="290">02 / SHARED</text><text x="836" y="290">03 / SERVER</text></g>
    <g font-size="29" font-weight="700"><text x="92" y="344">One component</text><text x="464" y="344">Across screens</text><text x="836" y="344">Remote data</text></g>
    <g font-size="21" fill="#53636c"><text x="92" y="390">Forms · tabs · dialogs</text><text x="464" y="390">Session · preferences</text><text x="836" y="390">Posts · users · queries</text></g>
    <g font-family="monospace" font-size="19"><text x="92" y="440">useState / useReducer</text><text x="464" y="440">Context / Zustand</text><text x="836" y="440">Query cache</text></g>
    <text x="64" y="550" font-size="18" fill="#53636c">A conversation starter, not a rulebook. How does your team organize state?</text>
  </g>
</svg>
